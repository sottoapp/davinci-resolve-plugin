# CI on AppVeyor: hook tests on Windows, Linux, macOS; full plugin checks on Linux only.
# Not yet run: sign in at ci.appveyor.com with GitHub, add this repo, push. If an image's node setup line fails, fix that image's `install`.
version: "{build}"
image:
  - Visual Studio 2022
  - Ubuntu2204
  - macos
environment:
  nodejs_version: "22"
skip_tags: true
build: off

for:
  - matrix:
      only:
        - image: Visual Studio 2022
    install:
      - ps: Install-Product node $env:nodejs_version x64
    test_script:
      - node --test plugin/hooks/test/guards.test.mjs plugin/hooks/test/handoff.test.mjs

  - matrix:
      only:
        - image: macos
    install:
      - sh: nvm install $nodejs_version && nvm use $nodejs_version
    test_script:
      - sh: node --test plugin/hooks/test/guards.test.mjs plugin/hooks/test/handoff.test.mjs

  - matrix:
      only:
        - image: Ubuntu2204
    install:
      - sh: nvm install $nodejs_version && nvm use $nodejs_version
      - sh: npm install -g @anthropic-ai/claude-code
    test_script:
      - sh: node --test plugin/hooks/test/guards.test.mjs plugin/hooks/test/handoff.test.mjs
      - sh: python3 scripts/validate_plugin.py
      - sh: python3 scripts/gen_skill_library.py && git diff --exit-code plugin/docs/skill-library.md
      - sh: claude plugin validate --strict plugin
      - sh: claude plugin validate --strict .
